<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360">
<style>
@font-face { font-family: Serif; src: url(data:font/woff2;base64,); }
@font-face { font-family: Mono; src: url(data:font/woff2;base64,); }

.name { font-family: Serif; font-size: 104px; letter-spacing: -3px; fill: #ecebe7; }
.sub { font-family: Mono; font-size: 18px; fill: #9a9a9f; }
.joke { font-family: Mono; font-size: 16px; fill: #6b6b70; }
.hex { font-family: Mono; font-size: 10px; fill: #2a2a2c; }
.chip { font-family: Mono; font-size: 11px; opacity: 0.8; }
.strip { transform-origin: 836px 312px; transform-box: view-box; animation: open 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
@keyframes open { from { transform: rotate(14deg); } }

</style>

<defs>
	<clipPath id="frame"><rect width="1000" height="360" rx="16"/></clipPath>
	<filter id="shade" x="-20%" y="-20%" width="140%" height="140%">
		<feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
	</filter>
</defs>
<g clip-path="url(#frame)">
